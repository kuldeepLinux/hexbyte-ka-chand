<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Karwa Chauth Kuldeep 🌙</title>
    <style>
        body {
            background-color: #0d1117;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 50px 20px;
            overflow: hidden;
        }
        h1 {
            color: #ffd700;
            font-size: 2rem;
            text-shadow: 0 0 10px #ffd700;
            margin-bottom: 10px;
        }
        p {
            color: #c9d1d9;
            font-size: 1.2rem;
        }
        .moon-container {
            margin-top: 50px;
            position: relative;
            display: inline-block;
        }
        .moon {
            font-size: 120px;
            text-shadow: 0 0 40px #ffd700, 0 0 80px #ffd700;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <h1>🌙 Happy Karwa Chauth, Kuldeep! 🌙</h1>
    <p>Chand nikalne ka intezaar khatam. Screen par hi dekh lo:</p>

    <div class="moon-container">
        <div class="moon">🌕</div>
    </div>
    
    <div class="stars" id="star-container"></div>

    <p style="margin-top: 50px; color: #7ee787;">Bhagwan kare aapki har mannat poori ho! ✨</p>

    <script>
        // Stars create karne ka code
        const starContainer = document.getElementById('star-container');
        for (let i = 0; i < 50; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            star.style.width = Math.random() * 3 + 'px';
            star.style.height = star.style.width;
            star.style.left = Math.random() * 100 + 'vw';
            star.style.top = Math.random() * 100 + 'vh';
            star.style.animationDelay = Math.random() * 2 + 's';
            starContainer.appendChild(star);
        }
    </script>

</body>
</html>
