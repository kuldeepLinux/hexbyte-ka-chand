<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karwa Chauth - Chand Darshan 🌙</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    min-height: 100vh;
    /* Aapki bheji hui image jaisa realistic background */
    background: url('https://images.unsplash.com/photo-1544027993-37dbfe43562a?q=80&w=1920&auto=format&fit=crop') no-repeat center center/cover;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    position: relative;
  }

  /* Thoda sa dark overlay taaki text clear dikhe */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.3);
    z-index: 1;
  }

  .moon-container {
    position: absolute; left: 50%; bottom: -300px;
    transform: translateX(-50%);
    animation: moonRise 8s ease-out forwards; z-index: 10;
  }
  
  @keyframes moonRise {
    0% { bottom: -300px; opacity: 0; }
    20% { opacity: 1; }
    100% { bottom: 40%; opacity: 1; }
  }

  .moon {
    width: 220px; height: 220px;
    border-radius: 50%;
    position: relative;
    animation: moonGlow 3s infinite ease-in-out;
    overflow: hidden;
    /* Image ke andar ka chand */
    background: url('https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/FullMoon2010.jpg/600px-FullMoon2010.jpg') no-repeat center center/cover;
    box-shadow: 
      0 0 50px 15px rgba(255, 255, 255, 0.6),
      0 0 100px 40px rgba(150, 200, 255, 0.4),
      0 0 150px 80px rgba(100, 150, 255, 0.2);
  }

  @keyframes moonGlow {
    0%, 100% { 
      box-shadow: 0 0 50px 15px rgba(255,255,255,0.6), 0 0 100px 40px rgba(150,200,255,0.4), 0 0 150px 80px rgba(100,150,255,0.2); 
    }
    50% { 
      box-shadow: 0 0 70px 25px rgba(255,255,255,0.8), 0 0 130px 60px rgba(150,200,255,0.6), 0 0 200px 100px rgba(100,150,255,0.3); 
    }
  }

  .title {
    position: absolute; top: 30px; width: 100%; text-align: center;
    color: #ffffff; font-size: 2.2em; font-weight: bold;
    text-shadow: 0 0 20px rgba(255,255,255,0.8), 0 0 10px rgba(0,0,0,0.5); 
    z-index: 20;
    animation: fadeIn 2s ease-out; padding: 0 20px;
  }
  .subtitle {
    font-size: 0.5em; color: #d0e0ff; font-weight: normal;
    display: block; margin-top: 8px; opacity: 0.9;
  }
  
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message {
    position: absolute; bottom: 40px; width: 100%; text-align: center;
    color: #ffffff; font-size: 1.3em; z-index: 20; opacity: 0;
    animation: messageIn 3s 6s forwards; padding: 0 20px;
    text-shadow: 0 0 15px rgba(0,0,0,0.8), 0 0 10px rgba(255,255,255,0.5);
    font-weight: bold;
  }
  
  @keyframes messageIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Diya */
  .diya { position: absolute; bottom: 30px; z-index: 25; animation: flicker 2s infinite ease-in-out; }
  .diya-left { left: 10%; }
  .diya-right { right: 10%; }
  .diya-body {
    width: 50px; height: 25px;
    background: linear-gradient(180deg, #b71c1c, #7f0000);
    border-radius: 0 0 25px 25px; position: relative;
    box-shadow: 0 5px 15px rgba(0,0,0,0.5);
  }
  .flame {
    position: absolute; top: -22px; left: 50%;
    transform: translateX(-50%); width: 14px; height: 22px;
    background: radial-gradient(ellipse at bottom, #fff59d, #ffb300 50%, #ff6f00);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    animation: flicker 0.5s infinite alternate;
    box-shadow: 0 0 20px 8px rgba(255,180,0,0.6);
  }
  
  @keyframes flicker {
    0%, 100% { transform: translateX(-50%) scale(1); opacity: 1; }
    50% { transform: translateX(-50%) scale(1.15); opacity: 0.85; }
  }

  @media (max-width: 600px) {
    .moon { width: 160px; height: 160px; }
    .title { font-size: 1.6em; }
    .message { font-size: 1em; }
    .diya-left { left: 5%; }
    .diya-right { right: 5%; }
  }
</style>
</head>
<body>

  <div class="title">
    🌙 करवा चौथ 🌙
    <span class="subtitle">चाँद दर्शन • Chand Darshan</span>
  </div>

  <!-- Real Chand Container -->
  <div class="moon-container">
    <div class="moon"></div>
  </div>

  <!-- Diyas -->
  <div class="diya diya-left"><div class="diya-body"><div class="flame"></div></div></div>
  <div class="diya diya-right"><div class="diya-body"><div class="flame"></div></div></div>

  <!-- Message -->
  <div class="message">
    ✨ चाँद निकल आया है — अब व्रत तोड़ें 🙏 ✨
  </div>

</body>
</html>
