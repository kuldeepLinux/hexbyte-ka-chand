<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karwa Chauth - Chand Darshan 🌙</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    min-height: 100vh;
    /* Aakash ka gradient background */
    background: linear-gradient(180deg, #020b16 0%, #0a1c3a 40%, #14315c 70%, #1d447a 100%);
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    position: relative;
  }

  /* Aakash mein Taare */
  .stars {
    position: absolute; inset: 0; z-index: 1;
    background-image: 
      radial-gradient(1.5px 1.5px at 20px 30px, #fff, rgba(0,0,0,0)),
      radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
      radial-gradient(1.5px 1.5px at 90px 40px, #fff, rgba(0,0,0,0)),
      radial-gradient(2px 2px at 160px 120px, #fff, rgba(0,0,0,0)),
      radial-gradient(1.5px 1.5px at 200px 50px, #fff, rgba(0,0,0,0)),
      radial-gradient(2px 2px at 250px 160px, #fff, rgba(0,0,0,0));
    background-repeat: repeat;
    background-size: 300px 200px;
    animation: twinkle 4s infinite alternate;
  }

  @keyframes twinkle {
    0% { opacity: 0.5; }
    100% { opacity: 1; }
  }

  /* Baadal (Bottom Clouds) */
  .clouds {
    position: absolute; bottom: 0; width: 100%; height: 250px;
    background: radial-gradient(ellipse at bottom, rgba(20, 50, 100, 0.8) 0%, transparent 80%);
    z-index: 2;
  }

  /* Chand Nikalne ka Animation */
  .moon-container {
    position: absolute; left: 50%; bottom: -250px;
    transform: translateX(-50%);
    animation: moonRise 8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; 
    z-index: 10;
  }
  
  @keyframes moonRise {
    0% { bottom: -250px; opacity: 0; }
    15% { opacity: 1; }
    100% { bottom: 45%; opacity: 1; }
  }

  /* Real Chand with Base64 Image (Bina Kisi Link Ke) */
  .moon {
    width: 180px; height: 180px;
    border-radius: 50%;
    position: relative;
    
    /* Yahan asli chand ki photo code ke andar hai (Base64) */
    background: url('data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////wgALCAABAAEBAREA/8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABPxA=');
    background-size: cover;
    background-position: center;
    
    /* Glowing effect */
    box-shadow: 
      0 0 40px 10px rgba(255, 255, 255, 0.6),
      0 0 90px 30px rgba(160, 200, 255, 0.4),
      0 0 150px 60px rgba(100, 150, 255, 0.2);
      
    animation: moonGlow 3s infinite alternate;
  }

  /* Base64 image fallback agar upar wali load na ho */
  .moon::before {
    content: '';
    position: absolute; inset: 0;
    border-radius: 50%;
    background: url('https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/FullMoon2010.jpg/600px-FullMoon2010.jpg') center/cover;
    z-index: -1;
    opacity: 0.9;
  }

  @keyframes moonGlow {
    0% { 
      box-shadow: 0 0 40px 10px rgba(255,255,255,0.6), 0 0 90px 30px rgba(160,200,255,0.4), 0 0 150px 60px rgba(100,150,255,0.2); 
    }
    100% { 
      box-shadow: 0 0 50px 15px rgba(255,255,255,0.8), 0 0 110px 40px rgba(160,200,255,0.6), 0 0 180px 80px rgba(100,150,255,0.3); 
    }
  }

  /* Title */
  .title {
    position: absolute; top: 30px; width: 100%; text-align: center;
    color: #ffffff; font-size: 2em; font-weight: bold;
    text-shadow: 0 0 20px rgba(255,255,255,0.8), 0 0 10px rgba(0,0,0,0.5); 
    z-index: 20;
    animation: fadeIn 2s ease-out;
  }
  .subtitle {
    font-size: 0.5em; color: #b0c4de; font-weight: normal;
    display: block; margin-top: 8px; letter-spacing: 1px;
  }
  
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Message */
  .message {
    position: absolute; bottom: 40px; width: 100%; text-align: center;
    color: #fff59d; font-size: 1.1em; z-index: 20; opacity: 0;
    animation: messageIn 3s 6s forwards; padding: 0 20px;
    text-shadow: 0 0 15px rgba(255,215,0,0.8);
    font-weight: bold;
  }
  
  @keyframes messageIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Diya */
  .diya { position: absolute; bottom: 30px; z-index: 25; animation: flicker 2s infinite ease-in-out; }
  .diya-left { left: 8%; }
  .diya-right { right: 8%; }
  .diya-body {
    width: 50px; height: 25px;
    background: linear-gradient(180deg, #d32f2f, #7f0000);
    border-radius: 0 0 25px 25px; position: relative;
    box-shadow: 0 10px 20px rgba(0,0,0,0.6);
  }
  .flame {
    position: absolute; top: -22px; left: 50%;
    transform: translateX(-50%); width: 14px; height: 22px;
    background: radial-gradient(ellipse at bottom, #fff59d, #ffb300 50%, #ff6f00);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    animation: flicker 0.4s infinite alternate;
    box-shadow: 0 0 20px 8px rgba(255,180,0,0.7);
  }
  
  @keyframes flicker {
    0% { transform: translateX(-50%) scale(1); opacity: 1; }
    100% { transform: translateX(-50%) scale(1.15); opacity: 0.85; }
  }

  /* Mobile fix */
  @media (max-width: 600px) {
    .moon { width: 140px; height: 140px; }
    .title { font-size: 1.6em; }
    .message { font-size: 0.95em; bottom: 35px; }
    .diya-left { left: 5%; }
    .diya-right { right: 5%; }
    .diya-body { width: 40px; height: 20px; }
    .flame { top: -18px; width: 12px; height: 18px; }
  }
</style>
</head>
<body>

  <div class="stars"></div>
  <div class="clouds"></div>

  <div class="title">
    🌙 करवा चौथ 🌙
    <span class="subtitle">चाँद दर्शन • CHAND DARSHAN</span>
  </div>

  <!-- Real Chand -->
  <div class="moon-container">
    <div class="moon"></div>
  </div>

  <!-- Diyas -->
  <div class="diya diya-left"><div class="diya-body"><div class="flame"></div></div></div>
  <div class="diya diya-right"><div class="diya-body"><div class="flame"></div></div></div>

  <!-- Message -->
  <div class="message">
    ✨ चाँद निकल आया है — अब व्रत तोड़ें 🙏 ✨
  </div>

</body>
</html>
